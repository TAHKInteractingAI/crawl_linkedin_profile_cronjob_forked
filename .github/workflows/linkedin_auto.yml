name: LinkedIn 24/7 Batch Crawler
on:
  repository_dispatch:
    types: [run-linkedin-crawler-bot]
  workflow_dispatch:

jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Thêm quyền cho GITHUB_TOKEN để có thể xóa cache
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1. Khôi phục tất cả cookie từ cache
      - name: Restore LinkedIn Cookies
        uses: actions/cache@v3
        with:
          path: cookies_acc*.pkl
          key: ${{ runner.os }}-linkedin-session-v2-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-linkedin-session-v2-

      # 2. Chạy Script với đầy đủ biến môi trường cho 2 tài khoản
      - name: Run Crawler
        if: github.event.action == 'run-linkedin-crawler-bot'
        env:
          SHEET_ID_OR_URL: ${{ secrets.SHEET_ID_OR_URL }}
          GOOGLE_APPLICATION_CRED: ${{ secrets.GOOGLE_APPLICATION_CRED }}
          MISSIVE_API_KEY: ${{ secrets.MISSIVE_API_KEY }}
          # Tài khoản chính
          LINKEDIN_USERNAME_1: ${{ secrets.LINKEDIN_USERNAME_1 }}
          # Tài khoản dự phòng
          LINKEDIN_USERNAME_2: ${{ secrets.LINKEDIN_USERNAME_2 }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
        run: python crawl_linkedin_profiles.py

      # 3. Lưu lại các file cookie (cả cũ và mới/cập nhật) cho lần chạy sau
      - name: Save LinkedIn Cookies
        if: always()
        uses: actions/cache@v3
        with:
          path: |
            cookies_acc*.pkl
          key: ${{ runner.os }}-linkedin-session-v2-${{ github.run_id }}